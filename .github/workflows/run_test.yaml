name: Run Unit Tests via Pytest

# Documentation-only changes cannot change a test result, so they do not run
# the suite. This matters here because a single push to a PR branch costs TWO
# ~35-minute jobs (push -> fast tests, pull_request -> slow tests), and over
# half the commits on a docs-heavy branch touch no testable code at all.
#
# Nothing below holds tests: pytest collects `*_test.py` only, and there are
# none under docs/ or .claude/. docs/ has its own targeted workflow
# (run_docs.yaml, which watches the three files that actually drive doc
# generation), and ruff still lints EVERYTHING on every push via
# run_linter.yaml — including the Python under .claude/skills — so a syntax
# error in a skill script is still caught in ~30 s.
#
# Note the two events filter differently. `push` matches the files in the
# pushed commits; `pull_request` matches the whole PR diff. So a docs commit
# on a PR that also contains code skips the push job but still runs the PR
# job — that is correct (the PR as a whole does touch code), and `[skip ci]`
# in the commit message is the escape hatch for the rest.
#
# Safe because no branch has protection rules: with a required status check,
# a filtered-out job never reports and the PR blocks forever on a pending
# check. Revisit this if branch protection is ever enabled.
# The two lists are duplicated deliberately: GitHub Actions does not resolve
# YAML anchors/aliases in workflow files, so `&x`/`*x` would silently not do
# what it looks like. Keep them in sync by hand.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '**.png'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '**.png'
      - '.gitignore'

concurrency:
  # For pull requests: group by PR number
  # For branch pushes: group by branch name
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3

      # Job-local JAX/XLA compilation cache (nothing is uploaded or persisted
      # — the dir dies with the runner). In today's single-process pytest run
      # JAX's in-memory dedup already reuses identical modules, so this is
      # mostly insurance: it keeps that reuse if the suite is ever split
      # across processes (pytest-xdist) or a step restarts, at zero cost.
      # Set via $GITHUB_ENV because the `runner` context is not available in
      # job-level `env` (the workflow fails validation there).
      # NOTE deliberately NOT actions/cache'd across runs: entries are
      # native code and the cache key does not include CPU features, while
      # this runner pool is CPU-heterogeneous — a cross-machine hit could
      # be an illegal-instruction crash, not just a miss.
      - name: Enable job-local JAX compilation cache
        run: echo "JAX_COMPILATION_CACHE_DIR=$RUNNER_TEMP/jax-cache" >> "$GITHUB_ENV"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the wheel downloads. jax/jaxlib and the scientific stack are
          # a large, almost-never-changing install repeated on every job, and
          # a PR branch push runs two jobs. Keyed on requirements.txt, so a
          # dependency change invalidates it automatically. Unlike the path
          # filter this costs no coverage at all — it speeds up the runs that
          # DO need to happen.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      # run fast tests when triggered by a push 
      - name: Test with pytest (no slow tests on push)
        if: github.event_name == 'push'
        run: |
          pytest -v -s -m "not slow" --cov=jcm --cov-fail-under=90

      # run slow tests when triggered by a push to an open PR
      # Uses .coveragerc-pr which omits utility / orchestration modules
      # already well-covered by the push-mode fast-test suite, so the
      # 80% threshold reflects main-path integration coverage.
      - name: Test with pytest (include slow tests on PR)
        if: github.event_name == 'pull_request'
        run: |
          pytest -v -s -m "slow" --cov=jcm --cov-config=.coveragerc-pr --cov-fail-under=80
