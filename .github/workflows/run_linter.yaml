name: Linting via Ruff

# Unfiltered ruff over the whole tree, on both events. `pull_request` is not
# redundant with `push`: a fork branch never pushes to this repo, so without
# it a fork PR touching only the paths run_test.yaml ignores (`.claude/**`,
# `docs/**`) is never linted at all — the fork blind spot that put five ruff
# errors on dev in #753 (see #816). This workflow carries no paths filter, so
# it is the only ruff run that covers those paths.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff==0.15.17  # pin: unpinned latest drifted new rules (BLE001/RUF059) onto a clean repo 2026-07
      - name: Run Ruff
        run: ruff check .
        continue-on-error: false