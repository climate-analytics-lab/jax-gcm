name: Validate documentation generation

# Three gates on the documentation, in increasing cost:
#   1. validate-docs          — the SPEEDY translation page still generates.
#   2. science-register-guard — the living model description's pointers still
#                               resolve (stdlib only, seconds).
#   3. strict-sphinx-build    — the WHOLE tree builds with warnings as errors.
#
# The SPEEDY variable-translation page is generated at Sphinx build time from
# jcm/physics/speedy/units_table.csv (see docs/source/conf.py); it is no longer
# committed back to the repo by CI (which bypassed the PR rule — issue #394).
# Job 1 only *validates* that generation succeeds, without write permission and
# without committing anything.

on:
  pull_request:
    # Every path that can change a rendered page (#829). The previous filter
    # listed only conf.py, index.rst and docs/source/science/**, so an edit to
    # design.rst, release_notes.rst or api.rst triggered neither this workflow
    # nor run_test.yaml (which ignores docs/**) and could merge unbuilt.
    #
    # Only `pull_request` is listed, as before. A PR is the merge gate, so no
    # docs-only change reaches dev without this build; adding `push` would
    # double the cost of every docs branch for no extra coverage.
    paths:
      # The whole docs tree — conf.py, the science pages and the templates.
      - 'docs/**'
      # Pulled into the tree from the repo root by docs/source/jax_gotchas.md
      # (``{include} ../../JAX_gotchas.md``), so editing it edits a page.
      # README.md is deliberately absent: nothing under docs/source includes it.
      - 'JAX_gotchas.md'
      # The source of the generated SPEEDY translation page.
      - 'jcm/physics/speedy/units_table.csv'
      - '.github/workflows/run_docs.yaml'
      # NOTE deliberately NOT triggered by jcm/**/*.py, even though autosummary
      # renders those docstrings: that would run this workflow on nearly every
      # code PR for a gate the code already has (run_test.yaml covers the
      # modules and run_linter.yaml's ruff pydocstyle rules cover docstring
      # shape). A docstring edit that breaks the strict build therefore
      # surfaces on the next docs-touching PR rather than immediately — an
      # accepted trade, and the release checklist in #831 runs this build
      # explicitly against the release candidate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate translation docs (no commit)
        run: python docs/generate_docs.py

      - name: Fail if generation produced no output
        run: test -s docs/source/speedy_translation.rst

  # The living model description's rot guard (docs/science_pointers_test.py)
  # must run on exactly the changes run_test.yaml's docs/** paths-ignore
  # skips — a doc-only PR is this guard's primary rot vector. Stdlib-only:
  # the guard imports no jcm, so a bare pytest suffices.
  science-register-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # No Issues API token, and no `issues:` permission on this workflow:
      # whether a cited issue is still OPEN is checked by
      # science_register.yaml, on issue-close and on a schedule, because that
      # verdict depends on GitHub rather than on the tree and must never
      # decide a pull request (#836). What runs here is the part that is a
      # pure function of the tree.
      - name: Run the science-register rot guard
        # Invoked directly (unittest main), NOT via pytest: the repo-root
        # conftest.py imports jax, which is not installed at this point.
        run: python docs/science_pointers_test.py -v

      - name: Test the tracked-gap helpers
        # Hermetic: every API call is stubbed, so the module that decides what
        # counts as stale is itself testable without asking GitHub anything.
        # PyYAML is the one dependency, for the assertions that this job holds
        # no Issues permission and that science_register.yaml never fires on a
        # pull request — the policy #836 bought, which is otherwise easy to
        # undo by accident.
        run: |
          pip install pyyaml
          cd docs && python tracked_gaps_test.py -v

  # The whole tree, warnings as errors. This replaces the build that used to
  # hang off the rot-guard job, which grepped the log for warnings ORIGINATING
  # in docs/source/science and left everything else advisory — so malformed
  # docstrings and a broken inline literal in release_notes.rst sat on dev
  # until the release review found them (#829). `--keep-going` reports every
  # problem in one run instead of stopping at the first, which is what makes a
  # strict gate cheap to clear.
  #
  # Run exactly this locally before pushing a docs change:
  #   sphinx-build -W --keep-going -b html docs/source /tmp/docs-html
  strict-sphinx-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Needs the package: conf.py imports jcm and api.rst autosummarises it.
      # sphinx, furo and myst-parser are all in requirements.txt, so `-e .`
      # installs the toolchain too. The optional pyses extra is deliberately
      # NOT installed: the API tree no longer walks the co-located *_test
      # modules that need it (see docs/source/_templates/autosummary/module.rst),
      # so this job also proves every *documented* module imports on the core
      # dependency set alone.
      - name: Install jcm + Sphinx toolchain
        run: pip install -e .

      - name: Build the full tree with warnings as errors
        run: sphinx-build -W --keep-going -b html docs/source /tmp/docs-html
