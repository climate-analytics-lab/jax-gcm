name: Validate documentation generation

# The SPEEDY variable-translation page is generated at Sphinx build time from
# jcm/physics/speedy/units_table.csv (see docs/source/conf.py); it is no longer
# committed back to the repo by CI (which bypassed the PR rule — issue #394).
# This job only *validates* that generation succeeds for changes that affect it,
# without write permission and without committing anything.

on:
  pull_request:
    paths:
      - 'jcm/physics/speedy/units_table.csv'
      - 'docs/generate_docs.py'
      - 'docs/source/conf.py'
      - 'docs/source/science/**'
      - 'docs/source/science.rst'
      - 'docs/source/index.rst'
      - 'docs/science_pointers_test.py'
  workflow_dispatch:

permissions:
  contents: read
  # The rot guard's issue-state check reads the Issues API with the workflow
  # token; unspecified permissions are none, and an underprivileged 403 is
  # indistinguishable from rate limiting (which skips the check).
  issues: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate translation docs (no commit)
        run: python docs/generate_docs.py

      - name: Fail if generation produced no output
        run: test -s docs/source/speedy_translation.rst

  # The living model description's rot guard (docs/science_pointers_test.py)
  # must run on exactly the changes run_test.yaml's docs/** paths-ignore
  # skips — a doc-only PR is this guard's primary rot vector. Stdlib-only:
  # the guard imports no jcm, so a bare pytest suffices.
  science-register-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run the science-register rot guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoked directly (unittest main), NOT via pytest: the repo-root
        # conftest.py imports jax, which is not installed at this point.
        run: python docs/science_pointers_test.py -v

      # Malformed MyST or a broken {doc} reference in a science page passes
      # the pointer guard but breaks the published docs; this build rejects
      # it. Failure is scoped to warnings ORIGINATING from the science pages
      # — a clean-environment build of the whole tree emits pre-existing
      # warnings elsewhere (autosummary importing *_test modules that need
      # optional extras, legacy docstring formatting) that this doc-path job
      # is not the place to gate. Needs the package: conf.py imports jcm.
      - name: Install jcm + Sphinx toolchain
        run: |
          pip install -e .
          pip install sphinx furo myst-parser

      - name: Build the docs; fail on science-page warnings
        run: |
          set -o pipefail
          sphinx-build -b html docs/source /tmp/docs-html 2>&1 | tee /tmp/sphinx-build.log
          if grep -E "source/science[./].*(WARNING|ERROR)|WARNING.*source/science[./]" /tmp/sphinx-build.log; then
            echo "::error::warnings originate from docs/source/science — fix the page(s) above"
            exit 1
          fi
