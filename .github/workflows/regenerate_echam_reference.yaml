name: Regenerate ECHAM regression reference (manual)

# Maintenance utility — run from the Actions tab (workflow_dispatch).
#
# WHY THIS EXISTS: the composable-physics regression references
# (jcm/data/test/composable_physics_regression/*.npz) are gridpoint snapshots
# compared at a tight tolerance (rtol=1e-3, atol=1e-4). That tolerance absorbs
# ULP-level reduction-order drift but NOT the difference between two *different*
# CPUs' XLA codegen: the 1-day ECHAM integration is chaotic enough that the
# per-host floating-point difference amplifies past the tolerance. A reference
# generated on a dev box (or this repo's local regenerate script) therefore does
# not match the GitHub Actions runner that validates it. Generating the snapshot
# *on a CI runner* — the same environment the test workflow runs in — is the only
# way to get a reference the test can match.
#
# This regenerates only the ECHAM T21L16 reference (the SPEEDY one is left
# untouched) and pushes the result back to the branch. The push uses
# GITHUB_TOKEN, which deliberately does not re-trigger CI; validate by pushing a
# follow-up commit (or re-running the test workflow) on the branch.
#
# TRIGGERS: ``workflow_dispatch`` is the intended entry point once this file
# lives on the default branch (a dispatchable workflow must be on the default
# branch). Until then — e.g. while still on a feature branch — push a commit
# whose message contains the ``[regen-ref]`` marker and the job runs; ordinary
# pushes skip it.
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  regenerate:
    # Only run on an explicit dispatch or a marked commit — not every push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[regen-ref]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Mirror the test workflow's environment exactly (same requirements.txt +
      # editable install) so the regenerated snapshot matches what
      # run_test.yaml computes on the same runner image.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Regenerate the ECHAM T21L16 reference
        run: |
          REGENERATE=1 pytest \
            jcm/physics/composable_physics_regression_test.py::TestEchamReferenceTrajectory \
            -m slow -p no:cacheprovider -q

      - name: Commit and push the regenerated reference if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ref='jcm/data/test/composable_physics_regression/echam_t21l16_1day.npz'
          if git diff --quiet -- "$ref"; then
            echo "Reference unchanged on this runner; nothing to commit."
          else
            git add "$ref"
            git commit -m "test(echam): regenerate T21L16 reference on CI runner

The gridpoint regression fingerprint must be generated on a GitHub Actions
runner to match the XLA CPU codegen the test workflow validates against;
locally-generated snapshots diverge past the rtol=1e-3 tolerance after the
1-day integration. Auto-generated by regenerate_echam_reference.yaml."
            git push origin "HEAD:${{ github.ref_name }}"
          fi
