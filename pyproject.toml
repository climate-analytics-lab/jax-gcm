[build-system]
requires = ["setuptools>=40.4"]
build-backend = "setuptools.build_meta"

[project]
name = "jcm"
version = "2.1.0b0"
dynamic = ["dependencies"]
description = "JAX-based General Circulation Model"
authors = [
    {email = "dwatsonparris@ucsd.edu"}
]
license = {text = "Apache"}
requires-python = ">=3.11"
keywords = ["climate", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
]

[tool.setuptools.packages.find]
include = ["jcm*"]
namespaces = true

[tool.setuptools.package-data]
jcm = [
    "config/**/*.yaml",
    "data/**/*.nc",
    "data/**/*.npy",
    "data/**/*.npz",
    "*.csv",
    "physics/speedy/*.csv",
]

[project.optional-dependencies]
# MAM4-JAX modal aerosol microphysics core (issue #490). GPL-3.0 — kept as an
# opt-in extra so the Apache-2.0 jcm core never bundles GPL code. Pinned to the
# tagged release. Install with `pip install jcm[mam4]`.
mam4 = [
    "mam4-jax @ git+https://github.com/reflective-org/MAM4-JAX.git@v0.2.0-beta.1",
]

# pySES CAM-SE spectral-element dynamical core (jcm/dycore/pyses). Pre-release
# pin: 0.1.3a2 is the first build that ships the pg2 physics-grid coupling
# machinery (pyses.dynamical_cores.finite_volume_grid) this backend uses.
# Install with `pip install jcm[pyses]`.
pyses = [
    "pyses>=0.1.3a2",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
python_files = "*_test.py"
markers = [
    "slow: marks tests as slow (> 1 min, deselect with '-m \"not slow\"')",
]

[tool.ruff.lint]
extend-select = ["D"]
ignore = [
    "D100", # missing public module docstrings
    "D101", # missing public class docstrings
    "D102", # missing public method docstrings
    "D103", # missing public function docstrings
    "D104", # missing public package docstrings
    # One of each mutually-incompatible docstring pair (ruff would
    # otherwise silently drop one): keep D211 (no blank line before
    # docstring) and D212 (summary on first line).
    "D203", # incompatible with D211
    "D213", # incompatible with D212
    "D205", # missing blank lines between summary line and description
    "D400", # first lines missing period
    "D415", # docstrings missing closing punctuation
    "D417", # missing argument descriptions
    "E731"
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821", "F811"]
