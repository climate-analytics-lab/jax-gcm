# 1-day smoke test — useful as a quick CI/CLI integration check.
#
# Inherits the complete base schema from ``run/default.yaml``; only the keys
# that differ from the default (a shorter, coarser-timestep single day and a
# more verbose log) are set below. The sponge stays disabled (``levels: 0``,
# inherited).
defaults:
  - default
  - _self_

time_step: 30
save_interval: 1
total_time: 1
log_level: INFO
output: smoke_run.nc
output_prefix: smoke_chunked
