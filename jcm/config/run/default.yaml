# Default run configuration: short integration with daily snapshots.
time_step: 10              # minutes
save_interval: 10          # days
total_time: 10             # days

# Model start date (ISO string, e.g. "1979-01-01"). Null keeps the
# default 2000-01-01. Transient (by-date) forcing files are sampled at
# the absolute model date, so historical/AMIP runs must set this to sit
# on the forcing calendar (issue #610).
start_date: null

output_averages: false
output: model_state.nc
# WARNING, not CRITICAL: jcm warns about results it cannot vouch for
# (e.g. an in-place physics-parameter change that never reached the
# computation, #735), and a silent run is not the same as a clean one.
log_level: WARNING

# Optional upper-sponge layer applied to (u, v) in the topmost ``levels``.
# Off by default — set ``run.sponge.levels`` to a positive integer to enable.
sponge:
  levels: 0
  timescale_h: 3.0
  enspodi: 2.0

# Chunked-mode options. When ``chunk_days > 0`` the integration is broken
# into chunks and run through ``jcm.diagnostics.check_health`` between each
# one — useful for long runs that may need to bail out on a NaN. Chunks are
# written to ``{output_prefix}_day{N}.nc``.
chunk_days: 0
output_prefix: chunked_run

# Interval-instantaneous snapshot stream (jax-gcm#586): with
# ``output_averages: true``, sample the listed 2-D diagnostics
# instantaneously every ``snapshot_interval`` (days; must divide
# save_interval) alongside the interval means. Written to
# ``<output stem>_snapshots.nc``. Fields are top-level diagnostics keys
# or dotted struct fields, e.g. [aerocom_clt, "radiation.toa_sw_up"].
snapshot_interval: null
snapshot_variables: []

# Checkpointing for preemptible chunked runs. When set, the model state
# (modal + physics carry) and elapsed sim-day count are saved to this
# path after each chunk; if the file already exists at startup the run
# resumes from it, skipping completed chunks. Single file per run, flax
# msgpack format. Leave ``null`` to disable.
checkpoint_path: null

# Runtime mode:
#   full        — standard dynamical-core integration (Model.run)
#   prescribed  — diagnose physics tendencies from a saved state file
#                 (PrescribedStateModel)
#   scm         — single-column physics evolution at one (lat, lon)
#                 (SingleColumnModel)
mode: full

# State file (xarray netCDF written by a previous JCM run) — required when
# ``mode`` is ``prescribed`` or ``scm``.
state_file: null

# Tracer variables to load from the state file (mapping tracer name →
# variable name), for ``mode`` ``prescribed`` / ``scm``.
#
# ``null`` (the default) means AUTO: every tracer the configured physics
# declares via ``required_tracers()`` is loaded from the identically-named
# variable when the file has one. That is what keeps a saved state's cloud
# condensate from being silently dropped — radiation driven on a state whose
# ``qc``/``qi`` went missing returns a plausible-looking clear sky (#718).
#
# Set an explicit mapping (e.g. ``{qc: qc, qi: qi}``) to override the names,
# or ``{}`` to deliberately load no tracers at all.
tracer_vars: null

# Column location for ``mode: scm`` (degrees).
column:
  lat_deg: 0.0
  lon_deg: 0.0
