# Long ECHAM run: one calendar year (12 Gregorian months from
# ``run.start_time``) written as calendar-month means (#901) —
# ``{output_prefix}_monthly_YYYY-MM.nc``, built from daily interval means that
# are streamed and not kept (``save_chunks: false``; set it true to also keep
# ``{output_prefix}_day{N}.nc``). 5-day chunks with health checks between
# them; the daily saves of one chunk are what sits in device memory, so the
# footprint matches the old 30-day chunks of 5-day saves. ECHAM's upper
# sponge is on (below). ``run.total_time=<days>`` still works (a fixed
# length, e.g. for benchmarks); ``run.total_time=null run.end_time=...`` for
# a named endpoint.
#
# Inherits the complete base schema from ``run/default.yaml``; only the keys
# that differ from the default are set below.
defaults:
  - default
  - _self_

time_step: 12
save_interval: 1
total_time: 12 months
output_averages: true
monthly_means: true
save_chunks: false
output: longrun.nc
log_level: INFO

# ECHAM's upper sponge (``mo_upper_sponge.f90::uspnge`` with the
# ``setdyn.f90`` lmidatm defaults): the zonal anomalies of u, v and T at the
# top model level relax on spdrag = 0.926e-4 1/s (3.0 h); the zonal mean is
# untouched, so the sponge neither removes angular momentum nor holds the
# lid temperature. ``timescale_h``/``enspodi`` stay null, i.e. ECHAM's
# values (see run/default.yaml). The same configuration starts cold from the
# dry JW profile (validated 60 days at T63L47 for the JAM and 1M members).
sponge:
  levels: 1

chunk_days: 5
output_prefix: longrun
