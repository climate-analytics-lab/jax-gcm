defaults:
  - _self_
  - physics: speedy
  - grid: speedy_t31_l8
  - dycore: dinosaur
  - run: default
  - init: isothermal
  - terrain: aquaplanet
  - forcing: default
  - nudging: none
  - diffusion: default
  - override hydra/help: custom_help

# Optional physical-constant overrides applied (process-globally) before the
# model is built — e.g. for a different planet or a sensitivity study. Only
# *base* fields of jcm.constants.PhysicalConstants may be set; derived constants
# (rd, cvd, rgrav, vtmpc*) follow automatically. Example:
#   python -m jcm.main +constants.grav=9.80665 +constants.rearth=6.4e6
constants: {}

# Virtual observers (jcm.observers): model fields sampled every timestep at
# stations, along a track, or under a sun-synchronous swath, each written to
# <output>_obs_<name>.nc (per chunk: <prefix>_day<N>_obs_<name>.nc). A mapping
# of observer name to spec; kinds and keys are in jcm.observers.
# observers_from_config and docs/source/design/observers.md. Example:
#   python -m jcm.main +observers.arm.kind=stations \
#       +observers.arm.file=/path/stations.csv \
#       '+observers.arm.variables=[temperature,specific_humidity]'
observers: {}

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: multirun/${hydra.job.num}
