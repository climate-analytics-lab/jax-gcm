# T63 / 47 hybrid (a + b·P_s) levels — matches ECHAM standard production
# grid (192 lon × 96 lat). Use this when running with the ECHAM
# T63GR15_jan_surf.nc + T63_amip{sst,sic}_1979-2008_mean.nc boundary files
# so no orography-statistic interpolation is needed.
vertical: hybrid
layers: 47
# Optional own hybrid table instead of the built-in one that `layers` names:
# {a: [...], b: [...]} half-level coefficients (Pa / dimensionless, top first)
# or the path of a netCDF file with ECHAM vct_a/vct_b; layers must then equal
# len(a) - 1 (or be null). null keeps the built-in L47/L95 table.
level_table: null
spectral_truncation: 63
spmd_mesh: null
