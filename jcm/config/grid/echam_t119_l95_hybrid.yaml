# T119 / 95 hybrid levels — the closest supported truncation to ECHAM's
# high-res MA configurations on a dinosaur-native grid. ECHAM's own T127
# grid is also available (echam_t127_l*_hybrid, supported but not
# validated). 360 lon x 180 lat on the middle-atmosphere L95 grid.
vertical: hybrid
layers: 95
# Optional own hybrid table instead of the built-in one that `layers` names:
# {a: [...], b: [...]} half-level coefficients (Pa / dimensionless, top first)
# or the path of a netCDF file with ECHAM vct_a/vct_b; layers must then equal
# len(a) - 1 (or be null). null keeps the built-in L47/L95 table.
level_table: null
spectral_truncation: 119
spmd_mesh: null
