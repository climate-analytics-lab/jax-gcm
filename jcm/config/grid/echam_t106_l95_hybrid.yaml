# T106 / 95 hybrid levels — classic ECHAM high-resolution truncation
# (320 lon x 160 lat) on the middle-atmosphere L95 grid. Fallback from
# T127L95 when the latter exceeds single-GPU memory.
vertical: hybrid
layers: 95
# Optional own hybrid table instead of the built-in one that `layers` names:
# {a: [...], b: [...]} half-level coefficients (Pa / dimensionless, top first)
# or the path of a netCDF file with ECHAM vct_a/vct_b; layers must then equal
# len(a) - 1 (or be null). null keeps the built-in L47/L95 table.
level_table: null
spectral_truncation: 106
spmd_mesh: null
