# Dinosaur spectral dynamical core (the default backend). Horizontal /
# vertical discretization comes from the ``grid`` group; diffusion from the
# ``diffusion`` group; the timestep from ``run.time_step`` (minutes).
name: dinosaur

# Opt-in per-step diagnostic providers on the physics grid.
# compute_omega: pressure vertical velocity (omega = Dp/Dt, Pa/s) from the
# core's own diagnostic state, consumed by the AeroCom ``plev`` group as
# wap/w500/w700 (zero-filled when off). Costs a few modal->nodal
# transforms per step. ``null`` means "decide from the physics config":
# on when the AeroCom plev group runs, off otherwise. Set true/false to
# override either way.
compute_omega: null

# Transport scheme: semi_lagrangian | eulerian | null. ``null`` means
# "decide from the physics": SPEEDY declares the Eulerian spectral core it
# was formulated and tuned on (it carries no extra tracers, and SL costs
# ~4x the step on CPU for no benefit there); everything else — and any
# composition that carries extra tracers — runs semi-Lagrangian, because
# spectral transport rings negative on sharp tracers and NaN'd the aerosol
# microphysics (#521). An explicit ``eulerian`` with tracer-carrying
# physics runs but logs a warning.
advection: null
