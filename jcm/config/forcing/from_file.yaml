# Realistic surface forcing loaded from a netCDF boundary file (SST, sea
# ice, land T, soil moisture, snow cover, albedo). The path must be set at
# the command line: ``forcing=from_file forcing.file=/path/to/forcing.nc``.
#
# Every *_file here (and terrain.file / dycore.terrain_file) also accepts
# an ``hf://`` path into the project data mirror
# (huggingface.co/datasets/climate-analytics-lab/jax-gcm-data), e.g.
#   forcing.file=hf://bundles/t63/forcing_pd.nc
#   forcing.emissions_file=hf://bundles/t63/emissions_pd.nc
#   forcing.oxidants_file=hf://bundles/t63_l47/oxidants_pd.nc
# Files download once into the local HF cache (fetch on a node with
# internet first; compute nodes reuse the cache).
kind: from_file
file: ???

# Ozone climatology netCDF, pre-interpolated to model levels (see
# ``jcm.data.bc.interpolate_ozone``). ``auto`` (default) resolves the
# packaged ``jcm/data/bc/<grid>/ozone.nc``, warning and falling back to
# the analytical profile when none fits (~12 W/m² OLR low bias). ``null``
# forces the analytical profile silently.
ozone_file: auto

# Optional prescribed aerosol emissions netCDF, already on the model grid
# (regrid with ``jcm.data.emissions.prepare`` first). Auto-routes by content:
# ``emis_<sector>_<species>`` → bulk/differentiable path; ``aero_emis_<tracer>``
# → CAM6-faithful pre-speciated path. Needs a JAM physics package with the
# emission term(s) (e.g. ``physics=echam-jam``). Null → no prescribed emissions.
emissions_file: null

# Optional seawater-DMS monthly climatology netCDF (HAMMOZ layout:
# ``DMS_sea (time, lat, lon)`` in nmol/L, e.g.
# ``emiss_fields_dms_sea_monthly_T63.nc``), already on the model horizontal
# grid. Drives ``DmsEmissions`` (``physics=echam-jam``). Null → zero DMS
# emission.
dms_file: null

# Optional dust-source/erodibility monthly climatology netCDF (HAMMOZ layout:
# ``pot_source (time, lat, lon)`` in [0, 1], e.g.
# ``dust_potential_sources_T63.nc``), already on the model horizontal grid.
# Drives ``DustEmissions`` (``physics=echam-jam``). Null → zero dust emission.
dust_file: null

# Optional oxidant monthly climatology netCDF (HAMMOZ/MACC layout:
# ``OH/NO3/O3/H2O2_VMR_avrg (time, mlev, lat, lon)`` mole/mole on the model's
# hybrid levels, e.g. ``ham_oxidants_monthly_T63L47_macc.nc`` with
# ``grid=echam_t63_l47_hybrid``). Feeds ``PrescribedOxidants``
# (``physics=echam-jam``); null → the analytic interim oxidant proxies.
oxidants_file: null
