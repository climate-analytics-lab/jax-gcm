# Realistic surface forcing loaded from a netCDF boundary file (SST, sea
# ice, land T, soil moisture, snow cover, albedo). The path must be set at
# the command line: ``forcing=from_file forcing.file=/path/to/forcing.nc``.
#
# Every *_file here (and terrain.file / dycore.terrain_file) also accepts
# an ``hf://`` path into the project data mirror
# (huggingface.co/datasets/climate-analytics-lab/jax-gcm-data), e.g.
#   forcing.file=hf://bundles/t63/forcing_pd.nc
#   forcing.emissions_file=hf://bundles/t63/emissions_pd.nc
#   forcing.oxidants_file=hf://bundles/t63_l47/oxidants_pd.nc
# Files download once into the local HF cache (fetch on a node with
# internet first; compute nodes reuse the cache).
kind: from_file
file: ???

# Forced-mode surface fluxes (jax-gcm#301) are documented with the block in
# forcing/default.yaml; this group does not declare the key, so add it with
# ``+forcing.prescribed_surface_flux...``. It requires a forced-mode physics
# (physics=speedy-forced-flux / echam-forced-flux): with an interactive preset
# nothing reads the fluxes, so the run is rejected rather than silently
# ignoring them.

# Yearly transient bundles (issue #610): the surface ``file`` and the
# ``emissions_file`` / ``oxidants_file`` / ``ozone_file`` keys may be a {year}
# pattern, expanded over the inclusive range below and concatenated along
# time — set it in a forcing yaml as
# ``file: hf://bundles/t63/forcing_amip/{year}.nc`` with ``years: [1979, 1983]``.
# ``dms_file`` / the ``dust_*`` keys are climatology-only single files (no transient
# product is mirrored and their readers do not expand) — a {year} there is
# rejected at build time.
# A bare ``{`` is Hydra override syntax, so a CLI override must quote the value
# (outer single quotes for the shell, inner double quotes for Hydra):
# ``'forcing.file="hf://bundles/t63/forcing_amip/{year}.nc"'``. Plain paths
# ignore ``years``. When
# ``available_years`` gives the product's source coverage, the expansion
# pads the range by one year each side (clipped to coverage) so
# mid-month samples bracket the run's first/last dates under
# ``by_date_interp``.
years: null
available_years: null
# Per-product coverage overrides for the ozone / emissions / oxidants
# {year} patterns, when a product spans a different range than the main
# file (each falls back to ``available_years`` when null). Run dates
# beyond the expanded files clamp to the last sample. See ``forcing=era5``
# for a preset that sets these: its surface files run to 2024 but the
# amip ozone/emissions bundles end in 2022. The mirror ships no transient
# oxidants product, so ``oxidants_available_years`` only matters for a
# user-supplied transient oxidant series.
ozone_available_years: null
emissions_available_years: null
oxidants_available_years: null

# Time alignment for ``file``: wrap_year (a climatology replayed every model
# year), by_date (aligned on the file's absolute timestamps) or by_date_interp
# (linearly interpolated between them — the correct mode for AMIP mid-month
# boundary values (tosbcs), which are constructed so linear interpolation
# reconstructs observed monthly means). ``auto`` (default) resolves ONLY a
# data-mirror or packaged product, from the kind the mirror manifest records
# (climatology -> wrap_year, transient -> by_date); for any other file it
# RAISES — jcm does not guess whether a file is a climatology, because a
# one-year transient archive and a monthly climatology have identical time
# axes (#884). So a user file needs e.g. ``forcing.align=wrap_year``.
align: auto
# The same rule for the other time-resolved inputs, each declared separately
# because a run mixes kinds (e.g. transient SST with a present-day emission
# climatology). ``auto`` resolves mirror/packaged products (a transient ozone
# product -> by_date_interp, its mid-month means interpolated) and raises for a
# user file. An explicit value applies to every product of that key.
ozone_align: auto
emissions_align: auto
oxidants_align: auto

# Ozone climatology netCDF, pre-interpolated to model levels (see
# ``jcm.data.bc.interpolate_ozone``). ``auto`` (default) resolves the packaged
# ``jcm/data/bc/<grid>/ozone.nc`` then the mirror bundle, and raises when
# neither fits — the analytical profile's ~12 W/m² OLR low bias must be chosen,
# not inherited. ``analytic`` (or ``null``) chooses it; a sigma grid, which has
# no ozone product at all, still falls back with a warning.
ozone_file: auto

# --- Prescribed-emission inputs (JAM / online aerosol) -----------------------
# ``auto`` (default; same convention as ``forcing/default.yaml``): a JAM package
# resolves the per-grid present-day HF bundle for the model grid at build time,
# so ``physics=echam-jam forcing=from_file grid=echam_t63_l47_hybrid`` composes
# the emission inputs by itself. Non-JAM packages supply nothing. Each key also
# takes an explicit/``hf://`` path or ``null`` to opt out (the runner then warns
# it is emission-free); use ``auto`` — not a path template — to let a config
# follow the grid. Only ``emissions_file`` and ``oxidants_file`` accept a
# ``{year}`` pattern (expanded per year); ``dms_file`` and the ``dust_*`` keys
# are climatology-only single files or static maps and reject a ``{year}``.

# Prescribed aerosol emissions (``bundles/<grid>/emissions_pd.nc``); auto-routes
# by content (``emis_<sector>_<species>`` bulk / ``aero_emis_<tracer>``
# pre-speciated). Regrid a custom product with ``jcm.data.emissions.prepare``.
emissions_file: auto

# Seawater-DMS monthly climatology (``bundles/<grid>/dms.nc``); drives
# ``DmsEmissions``.
dms_file: auto

# The five Tegen/HAMMOZ dust inputs (#802). ``dust_file`` is the monthly
# effective-LAI potential-source climatology, which both gates the flux and
# multiplies it; the three static companions are mandatory alongside it (the
# scheme would otherwise run on an all-coarse, untuned soil, so a missing one
# raises). ``dust_roughness_file`` is the satellite roughness map, read only
# on the ``ndurough = 0`` sensitivity path. ``dust_file: null`` disables dust.
dust_file: auto
dust_preferential_file: auto
dust_soil_types_file: auto
dust_regions_file: auto
dust_roughness_file: auto

# Oxidant monthly climatology on the model's hybrid levels
# (``bundles/<grid>_l<nlev>/oxidants_pd.nc``); feeds ``PrescribedOxidants``.
# ``null`` → the analytic interim oxidant proxies.
oxidants_file: auto
