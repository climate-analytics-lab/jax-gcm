# @package _global_
#
# Middle-atmosphere JAM sweep at T119L47 — full JAM + semi-Lagrangian.
#
# Compose it with a single command:
#
#   python -m jcm.main +experiment=ma-t119-l47
#
# WHY each setting (mined from tools/benchmark.py's validated PRESETS):
#  - physics=echam-jam: ECHAM + JAM modal aerosol (auto emission inputs).
#  - grid=echam_t119_l47_hybrid: highest-resolution sweep member.
#  - init=jw, init.rh=0.0: Jablonowski-Williamson lapse-rate profile with a
#    fully DRY start. An isothermal cold start goes NaN within days at L47;
#    the dry-JW init lets radiation + surface fluxes moisten the column and
#    avoids the moist-init day-12 blow-up.
#  - terrain=from_file: T119 has NO mirror bundle. Supply a native T119
#    orography file at run time (terrain.file=/path/to/T119_terrain.nc);
#    left as the group's ??? so a missing path fails loudly.
#  - forcing=from_file + hf:// present-day T63 SST bundle, interpolated to
#    T119 by the loader. forcing.ozone_file: supply a level-matched L47
#    T119 ozone file (no mirror bundle exists); left as auto here, which
#    warns + falls back to the analytic profile if none is packaged.
#  - forcing.{emissions,dms,dust,oxidants}_file=null: T119 has NO mirror
#    bundle, so the JAM ``auto`` default cannot resolve them (the per-grid
#    bundles only exist for t63/t106 — jcm/data/mirror/build_mirror.py's
#    GRIDS) and would abort build_forcing. This member therefore runs
#    EMISSION-FREE, matching the pre-#640 middle-atmosphere benchmark, which
#    supplied no emission inputs at any resolution. To drive aerosol at T119,
#    prepare native-T119 emission files and point these keys at them.
#  - run=longrun: 30-day health-gated chunks with the settled production
#    upper sponge (levels=10, target_T_K=250) that stabilises the JW-dry
#    stratosphere; the 12-min L47/L95 step now comes from the shared default (run/default.yaml).
#  - sl_off_centering=0.2: semi-Lagrangian tracer-transport off-centering.
#    This is the dinosaur SL constructor/runner default (DEFAULT_OFF_CENTERING);
#    stated explicitly so the recorded config documents the value used.
defaults:
  - override /physics: echam-jam
  - override /grid: echam_t119_l47_hybrid
  - override /init: jw
  - override /terrain: from_file
  - override /forcing: from_file
  - override /run: longrun

init:
  rh: 0.0
forcing:
  file: hf://bundles/t63/forcing_pd.nc
  # Emission-free: T119 has no mirror bundle, so ``auto`` cannot resolve these
  # (see the header). Explicit nulls keep the composed run one command instead
  # of an abort on a non-existent bundles/t119/*.nc fetch.
  emissions_file: null
  dms_file: null
  dust_file: null
  oxidants_file: null
sl_off_centering: 0.2
