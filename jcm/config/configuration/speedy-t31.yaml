# @package _global_
#
# SPEEDY physics at T31L8 — the fast reference / smoke configuration.
#
# Compose it with a single command:
#
#   python -m jcm.main +configuration=speedy-t31
#
# WHY each setting (mined from tools/benchmark.py's validated PRESETS):
#  - physics=speedy + grid=speedy_t31_l8: the ported SPEEDY column physics
#    on its native low resolution; cheap enough for reference runs.
#  - init defaults to isothermal (NOT overridden): SPEEDY spins up from
#    isothermal rest. The ECHAM dry-JW init NaNs SPEEDY within a chunk, so
#    this preset keeps the config defaults (and run=default's sponge-free
#    lid; longrun's ECHAM sponge is not part of SPEEDY).
#  - terrain=from_file + interpolate: no native T31 orography exists, so the
#    packaged T63 field is bilinearly interpolated. Safe here because SPEEDY
#    composes no SSO scheme (interpolation would otherwise corrupt the
#    sub-grid-orography statistics).
#  - forcing from the mirror's present-day T63 bundle (interpolated to T31).
#  - run.time_step=15 min on the default (short) run group.
defaults:
  - override /physics: speedy
  - override /grid: speedy_t31_l8
  - override /terrain: from_file
  - override /forcing: from_file

terrain:
  file: hf://bundles/t63/terrain.nc
  interpolate: true
forcing:
  align: wrap_year
  file: hf://bundles/t63/forcing_pd.nc
run:
  time_step: 15
# SPEEDY's parameters for this configuration, calibrated at T31 against CERES-EBAF, GPCP, ERA5,
# ESA-CCI and MERRA-2 (jcm-monitor obs/t31) with JEM-Cal's Gauss-Newton driver, host speedy-t31:
# stage 1 (12 levers, 2 iterations) then stage 2 (+ablwin, 2 iterations), year arms, best arm
# arm-35a00c4d965a of run root /scr/dwatsonparris/speedy-tune/gn2 (loss 222.5 -> 67.9 against the
# pre-fit configuration). docs/source/design/speedy_retune.md has the recipe, the before/after
# table and what each value buys. The Python speedy_physics() keeps SPEEDY's reference values; in
# brackets below. Values at a bound of the fit say where SPEEDY's structure, not the parameter,
# limits the fit. The shortwave record is held by both the cloud and the shortwave-radiation
# terms; every value is set in both (the anchor).
physics:
  terms:
    speedy_clouds:
      sw_params: &speedy_sw
        # Clear-sky backscatter (jcm's addition; SPEEDY's clear sky only absorbs) [0]: puts the
        # clear-sky reflection near CERES, so the clouds need not be over-bright to reach it.
        refclr: 0.0564
        # Cloud-top albedo of the total cover [0.43]: the cover is smaller (rhcl1), so each
        # cloud reflects a little more.
        albcl: 0.500
        # Stratocumulus albedo [0.50], at the fit's lower bound: with the backscatter in place the
        # stratiform cover's reflection was most of the remaining SW-CRE excess.
        albcls: 0.200
        # RH at which the total cover starts [0.30], at the fit's upper bound: SPEEDY's cover is
        # bought down to cut the SW CRE excess and raise the OLR; this leaves cover 0.07 below
        # ESA-CCI and the LW CRE 7 W/m2 weak, the residual of the clear-sky OLR deficit.
        rhcl1: 0.55
        # Maximum stratocumulus cover [0.60].
        clsmax: 0.744
        # Window absorptivity of thick cloud [12]: the LW CRE per unit cover.
        ablcl1: 9.97
        # Weak-band water-vapour absorptivity [0.7] and window absorptivity of air [0.3], the
        # latter at the fit's lower bound: the two longwave levers of this fit. They buy all-sky
        # OLR (8 W/m2 below CERES before the fit, 5 after), not the clear sky, which stays 13
        # below; docs/source/design/speedy_longwave_fit.md has what that deficit is made of and
        # the joint longwave fit that is not adopted here yet.
        ablwv1: 1.07
        ablwin: 0.150
    speedy_shortwave_radiation:
      sw_params: *speedy_sw
    speedy_convection:
      convection_params:
        # Boundary-layer RH that triggers convection [0.9].
        rhbl: 0.870
    speedy_large_scale_condensation:
      condensation_params:
        # RH threshold of large-scale condensation at sigma = 1 [0.9].
        rhlsc: 0.920
    speedy_surface_flux:
      surface_params:
        # Heat and moisture exchange coefficients over sea [9.0e-4] and land [1.2e-3]: the
        # turbulent fluxes; the land one with the slab land's skin balance.
        chs: 8.75e-4
        chl: 1.77e-3
    speedy_vertical_diffusion:
      vdiff_params:
        # Shallow-convection relaxation time [6 h]: slower boundary-layer moisture export.
        trshc: 17.9
