# @package _global_
#
# SPEEDY physics at T31L8 — the fast reference / smoke configuration.
#
# Compose it with a single command:
#
#   python -m jcm.main +configuration=speedy-t31
#
# WHY each setting (mined from tools/benchmark.py's validated PRESETS):
#  - physics=speedy + grid=speedy_t31_l8: the ported SPEEDY column physics
#    on its native low resolution; cheap enough for reference runs.
#  - init defaults to isothermal (NOT overridden): SPEEDY spins up from
#    isothermal rest. The ECHAM dry-JW init NaNs SPEEDY within a chunk, so
#    this preset keeps the config defaults (and run=default's sponge-free
#    lid; longrun's ECHAM sponge is not part of SPEEDY).
#  - terrain=from_file + interpolate: no native T31 orography exists, so the
#    packaged T63 field is bilinearly interpolated. Safe here because SPEEDY
#    composes no SSO scheme (interpolation would otherwise corrupt the
#    sub-grid-orography statistics).
#  - forcing from the mirror's present-day T63 bundle (interpolated to T31).
#  - run.time_step=15 min on the default (short) run group.
defaults:
  - override /physics: speedy
  - override /grid: speedy_t31_l8
  - override /terrain: from_file
  - override /forcing: from_file

terrain:
  file: hf://bundles/t63/terrain.nc
  interpolate: true
forcing:
  align: wrap_year
  file: hf://bundles/t63/forcing_pd.nc
run:
  time_step: 15
# SPEEDY's parameters for this configuration (docs/source/design/speedy_retune.md). The shortwave
# record is held by both the cloud and the shortwave-radiation terms; every value is set in both.
physics:
  terms:
    speedy_clouds:
      sw_params: &speedy_sw
        # Clear-sky backscatter (jcm's addition; SPEEDY's clear sky only absorbs): first guess
        # from CERES clear-sky reflection over the ocean, refined by the retune.
        refclr: 0.05
    speedy_shortwave_radiation:
      sw_params: *speedy_sw
