# @package _global_
#
# SPEEDY physics at T31L8 — the fast reference / smoke configuration.
#
# Compose it with a single command:
#
#   python -m jcm.main +configuration=speedy-t31
#
# WHY each setting (mined from tools/benchmark.py's validated PRESETS):
#  - physics=speedy + grid=speedy_t31_l8: the ported SPEEDY column physics
#    on its native low resolution; cheap enough for reference runs.
#  - init defaults to isothermal (NOT overridden): SPEEDY spins up from
#    isothermal rest. The ECHAM dry-JW init NaNs SPEEDY within a chunk, so
#    this preset keeps the config defaults (and run=default's sponge-free
#    lid; longrun's ECHAM sponge is not part of SPEEDY).
#  - terrain=from_file + interpolate: no native T31 orography exists, so the
#    packaged T63 field is bilinearly interpolated. Safe here because SPEEDY
#    composes no SSO scheme (interpolation would otherwise corrupt the
#    sub-grid-orography statistics).
#  - forcing from the mirror's present-day T63 bundle (interpolated to T31).
#  - run.time_step=30 min on the default (short) run group: the step the Python Model takes for
#    this physics on this grid (SpeedySurfaceFlux.stable_time_step_minutes, capped at 30), so
#    the CLI and the Python API integrate, and are calibrated at, the same step.
defaults:
  - override /physics: speedy
  - override /grid: speedy_t31_l8
  - override /terrain: from_file
  - override /forcing: from_file

terrain:
  file: hf://bundles/t63/terrain.nc
  interpolate: true
forcing:
  align: wrap_year
  file: hf://bundles/t63/forcing_pd.nc
run:
  time_step: 30
# SPEEDY's parameters for this configuration. The clear-sky longwave is fitted to RRTMGP on this
# model's own columns (docs/source/design/speedy_longwave_fit.md); the cloud, shortwave,
# convection, condensation and surface-flux values are the centre of the JEM-Cal Gauss-Newton
# refit around it (host speedy-t31, year arms; run root /scr/dwatsonparris/speedy-tune/refit).
# SPEEDY's reference values are in brackets. A record several terms hold is set in every holder
# through its anchor.
physics:
  terms:
    speedy_clouds:
      sw_params: &speedy_sw
        # Clear-sky backscatter (jcm's addition; SPEEDY's clear sky only absorbs) [0].
        refclr: 0.07588
        # Cloud-top albedo of the total cover [0.43] and of the stratocumulus cover [0.50].
        albcl: 0.4469
        albcls: 0.2
        # RH at which the total cover starts [0.30] and is complete [1.0]; maximum
        # stratocumulus cover [0.60].
        rhcl1: 0.55
        rhcl2: 0.8595
        clsmax: 0.6471
        # Window absorptivity of cloud at and below the cloud top [12] and above it [0.6]: the
        # LW CRE per unit cover.
        ablcl1: 5.301
        ablcl2: 0.3
        # Shortwave absorptivities: dry air [0.033], aerosol [0.033], water vapour in the
        # visible [0.022] and near-infrared [15] bands.
        absdry: 0.02802
        absaer: 0.01703
        abswv1: 0.0588
        abswv2: 27.89
        # The clear-sky longwave, fitted to RRTMGP on this model's own columns (TOA and surface
        # fluxes, layer flux convergence and the 2xCO2 response): window absorptivity of air
        # [0.3] and its water-vapour continuum term ablwvc * q^2 * p/p0 [0], and the weak [0.7]
        # and strong [50] water-vapour band absorptivities.
        ablwin: 0.3397
        ablwvc: 0.02509
        ablwv1: 2.465
        ablwv2: 57.83
    speedy_shortwave_radiation:
      sw_params: *speedy_sw
      mod_radcon_params: &speedy_mod_radcon
        # The rest of the same longwave fit, in the record the forcing, radiation and surface
        # terms share: CO2-band absorptivity at the reference concentration [6.0], the "black"
        # fraction outside the four bands [0.05], and the band fractions a + b (T - t0)^2 of the
        # CO2 [0.148, -3.0e-6, 247], weak water-vapour [0.356, -5.2e-6, 282] and strong
        # water-vapour [0.314, 1.0e-5, 315] bands.
        ablco2_ref: 4.181
        epslw: 0.04947
        fbco2_a: 0.2863
        fbco2_b: -5.688e-6
        fbco2_t0: 119.2
        fbwv1_a: 0.3080
        fbwv1_b: -3.395e-5
        fbwv1_t0: 247.3
        fbwv2_a: 0.2941
        fbwv2_b: 4.322e-5
        fbwv2_t0: 268.9
    speedy_forcing:
      mod_radcon_params: *speedy_mod_radcon
    speedy_downward_longwave:
      mod_radcon_params: *speedy_mod_radcon
    speedy_upward_longwave:
      mod_radcon_params: *speedy_mod_radcon
    speedy_convection:
      convection_params:
        # Boundary-layer RH that triggers convection [0.9]; relaxation time [6 h]; RH below
        # which intermediate layers are moistened by the secondary mass flux [0.7], that flux's
        # ratio to the primary one [0.8]; maximum entrainment [0.5]; minimum surface pressure
        # for convection [0.8].
        rhbl: 0.8577
        trcnv: 5.641
        rhil: 0.6849
        smf: 1.173
        entmax: 0.8608
        psmin: 0.65
    speedy_large_scale_condensation:
      condensation_params:
        # RH threshold of large-scale condensation at sigma = 1 [0.9], its fall towards the top
        # [0.1], and the relaxation time [4 h].
        rhlsc: 0.867
        drhlsc: 0.02058
        trlsc: 2.39
    speedy_surface_flux:
      mod_radcon_params: *speedy_mod_radcon
      surface_params:
        # Heat and moisture exchange coefficients over sea [9.0e-4] and land [1.2e-3].
        chs: 0.000956
        chl: 0.002832
        # Near-surface extrapolation weights of humidity [0] and temperature [1]; amplitude
        # [0.67] and saturation temperature difference [3 K] of the stability correction; gust
        # speed [5 m/s].
        fhum0: 0.0
        ftemp0: 0.9152
        fstab: 0.6362
        dtheta: 1.5
        vgust: 4.327
    speedy_vertical_diffusion:
      vdiff_params:
        # Shallow-convection relaxation time [6 h].
        trshc: 20.64
