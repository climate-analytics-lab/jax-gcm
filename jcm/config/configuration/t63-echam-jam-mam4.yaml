# @package _global_
#
# ECHAM physics + JAM on CAM's MAM4 aerosol population at T63L47.
#
# A validated benchmark configuration. The default JAM configuration,
# t63-echam-jam, runs HAM's M7 population instead; this one is the MAM4
# alternative, about 30 % cheaper per simulated day at T63L47, with an
# explicit cloud-borne aerosol phase.
#
# Compose it with a single command:
#
#   python -m jcm.main +configuration=t63-echam-jam-mam4
#
# WHY each setting (mined from tools/benchmark.py's validated PRESETS):
#  - physics=echam-jam: ECHAM physics + JAM prognostic modal aerosol (MAM4).
#  - JAM present-day emission/oxidant bundles resolve automatically
#    (forcing.*_file: auto), so no hand-managed aerosol inputs needed.
#  - grid=echam_t63_l47_hybrid: ECHAM standard production grid.
#  - init=jw, init.rh=0.0: Jablonowski-Williamson lapse-rate profile with a
#    fully DRY start. An isothermal cold start goes NaN within days at L47;
#    the dry-JW init lets radiation + surface fluxes moisten the column and
#    avoids the moist-init day-12 blow-up.
#  - terrain=auto: native-grid orography (packaged jcm/data/bc/<grid> or the
#    mirror bundle). Terrain must be native — interpolation corrupts the SSO
#    sub-grid-orography fields.
#  - forcing=from_file + hf:// present-day bundle: prescribed SST/sea-ice from
#    the project data mirror (fetched once into the local HF cache). Ozone
#    stays forcing.ozone_file: auto, which resolves the packaged
#    climatology then the mirror bundle and RAISES if neither fits.
#  - run=longrun: one year of health-gated 5-day chunks written as monthly
#    means, with ECHAM's upper sponge (uspnge: the zonal anomalies at the top
#    level damped on 3 h); the 12-min L47/L95 step comes from the shared
#    default (run/default.yaml).
#  - sl_off_centering=0.2: semi-Lagrangian tracer-transport off-centering.
#    This is the dinosaur SL constructor/runner default (DEFAULT_OFF_CENTERING);
#    stated explicitly so the recorded config documents the value used.
defaults:
  - override /physics: echam-jam
  - override /grid: echam_t63_l47_hybrid
  - override /init: jw
  - override /terrain: auto
  - override /forcing: from_file
  - override /run: longrun

init:
  rh: 0.0
forcing:
  align: wrap_year
  file: hf://bundles/t63/forcing_pd.nc
sl_off_centering: 0.2
