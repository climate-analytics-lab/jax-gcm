# @package _global_
#
# ECHAM physics + the JAM harness on the M7 aerosol population at T63L47
# (jax-gcm#1017) — the default JAM configuration. The MAM4 population on the
# same host is t63-echam-jam-mam4.
#
#   python -m jcm.main +configuration=t63-echam-jam
#
# WHY each setting: the physics preset (physics/echam-jam-m7.yaml) carries the
# ECHAM-HAM reference switches and says why each one is what it is. Everything
# else mirrors t63-echam-jam-mam4.yaml (same grid, dry JW init, native terrain,
# present-day forcing bundle, longrun recipe), so the two configurations differ
# only in the aerosol model (and the chunk length, below) and can be compared
# like for like. Needs the jcm[m7] extra (see the physics preset).
defaults:
  - override /physics: echam-jam-m7
  - override /grid: echam_t63_l47_hybrid
  - override /init: jw
  - override /terrain: auto
  - override /forcing: from_file
  - override /run: longrun

init:
  rh: 0.0
forcing:
  align: wrap_year
  file: hf://bundles/t63/forcing_pd.nc
  # The physics preset selects ndust=5, whose MSG-SEVIRI Saharan map is not
  # one of the dust companions ``forcing/from_file.yaml`` defaults to "auto"
  # (only ndust=5 reads it; see that file's comment). Opt in here.
  dust_msg_file: auto
sl_off_centering: 0.2
# One-day chunks: longrun keeps a chunk's daily saves on the device until the
# chunk ends, and five of them with the M7 build exhaust a 40 GB A100 (a
# 12 GiB allocation fails at chunk 2); one fits. Chunk length leaves the
# throughput unchanged (MAM4 at T63L47: 22.55 vs 22.60 s/sim-day at 5- and
# 1-day chunks). A run that saves once per chunk, as the release matrix and
# tools/benchmark.py do, fits at 5-day chunks too.
run:
  chunk_days: 1
