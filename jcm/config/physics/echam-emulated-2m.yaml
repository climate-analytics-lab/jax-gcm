# ECHAM with the NN radiation emulator in place of RRTMGP, alongside the
# Lohmann 2-moment microphysics.
#
# Identical to ``echam-rrtmgp-2m.yaml`` with one term swap, so the two
# compose the same aerosol, cloud and dynamics path and differ only in
# how radiative fluxes are obtained.
#
# Trained weights ship with the package (``weights_file: auto`` below),
# so this preset runs out of the box. Point ``weights_file`` at another
# checkpoint to swap networks. ``weights_file: null`` builds randomly
# initialised weights, which are the starting point for training but
# drive the model to NaN inside a step — pair it with
# ``zero_tendency: true`` on the term to measure cost only.
#
# This is the direct term (``_target_``) path, where Hydra passes ``null``
# straight through to random init. Via the ``echam_physics(...)`` builder
# instead (``physics.builder``), ``emulator_weights_file: null`` is DROPPED
# and falls back to ``auto`` — there the train-from-scratch value is the
# explicit string ``"random"`` (``emulator_weights_file: random``).
#
# Use it as::
#
#     python -m jcm.main physics=echam-emulated-2m

vectorize_columns: true
checkpoint_terms: true

terms:
  moist_air_state:
    _target_: jcm.physics.diagnostics.moist_air_state.MoistAirColumnState
  echam_boundary_conditions:
    _target_: jcm.physics.forcing.echam_boundary_conditions.EchamBoundaryConditions
  macv2_sp_aerosol:
    _target_: jcm.physics.aerosol.Macv2SpAerosol
  simple_chemistry:
    _target_: jcm.physics.chemistry.SimpleChemistry
  sundqvist_cloud_fraction:
    _target_: jcm.physics.clouds.sundqvist.SundqvistCloudFraction
  nn_emulator_radiation:
    _target_: jcm.physics.radiation.nn_emulator_scheme.NNEmulatorRadiation
    # Per-band aerosol optics as input features, so the emulator can
    # represent the MACv2-SP forcing the term above produces.
    band_mode: per_band
    # NetCDF checkpoint from tools/radiation_emulator/train_emulator.py,
    # supplying the trained weights and both input scalings. ``auto``
    # resolves the packaged default (jcm/data/emulator_weights_per_band_u64.nc,
    # trained on the v3 labels — provenance in its global attributes); null
    # falls back to random weights (cost benchmarking only — see the
    # header). Every file is validated against band_mode, the band counts
    # and the output-channel count on load, so a checkpoint trained under
    # a different structure is rejected rather than silently run.
    weights_file: auto
  # ECHAM physc ordering: vdiff (with the surface exchange in its
  # implicit solve) runs BEFORE convection, so the Tiedtke zdqpbl
  # closure reads the SAME-STEP vdiff moisture tendency and delivered
  # evaporation. echam_surface only republishes the vdiff-delivered
  # fluxes, so it follows vdiff directly.
  tte_tke_vertical_diffusion:
    _target_: jcm.physics.vertical_diffusion.tte_tke.TteTkeVerticalDiffusion
  echam_surface:
    _target_: jcm.physics.surface.echam.surface_physics.EchamSurface
  tiedtke_convection:
    _target_: jcm.physics.convection.tiedtke_nordeng.TiedtkeConvection
  lohmann_2m_microphysics:
    _target_: jcm.physics.clouds.lohmann_2m.Lohmann2MMicrophysics
  hines_gwd:
    _target_: jcm.physics.gravity_waves.hines.HinesGwd
  lott_miller_sso:
    _target_: jcm.physics.gravity_waves.sso.LottMillerSso
