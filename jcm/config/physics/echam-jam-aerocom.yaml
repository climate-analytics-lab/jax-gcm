# ECHAM + JAM aerosol with the AeroCom phase-4 diagnostics attached.
#
# The AP4-CTRL / aci-baseline / MMPPE / imo2020 submissions need derived
# fields (cloud-top sampled quantities, column integrals, pressure-level
# winds, aerosol number metrics) that are not part of the normal output.
# This preset turns them on; post-process with tools/aerocom_cmor.py.
#
#     python -m jcm.main physics=echam-jam-aerocom grid=echam_t63_l47_hybrid
#
# The diagnostics are computed AFTER every other term and add no tendency.
#
# MEASURED COST (T63L47, A100, warm compiled step, vs the same run with
# enable_aerocom=false):
#
#   cloud                          +3.3 %
#   column                         +3.3 %
#   plev                           +3.0 %
#   aerosol                        +3.2 %
#   cloud+column+plev              +4.4 %
#   cloud+column+plev+aerosol      +9.4 %   <-- this preset
#
# Most of a single group's ~3 % is the term's fixed per-step overhead, so
# the groups are much cheaper together than their sum; the aerosol group is
# the largest true increment (~5 % on top of the other three) because of the
# per-mode lognormal integrals. Drop `aerosol` from the list below if a run
# does not need N70/N100/PM/burdens and you want to stay nearer ~4 %.
#
# NOT included here because it roughly DOUBLES runtime: the aerosol-free
# (*noa) radiation diagnostic needs a second radiation call, and radiation
# is ~87 % of the step. It is gated separately — see jax-gcm#583.
#
# Also gated separately: the per-species / per-mode / spectral aerosol
# optics (#584), which need a second Mie sweep — use the
# ``echam-jam-aerocom-optics`` preset. Remaining coverage gap: #586
# (3-hourly instantaneous output).

defaults:
  - echam-jam

enable_aerocom: true
# cloud: cloud-top sampling + optical depths + condensate paths
# column: water-vapour path, column number, albedo
# plev: winds on pressure surfaces + LTS
# aerosol: per-species burdens + N70/N100/PM1/PM10 (needs the JAM module)
# The plev group's wap/w500/w700 come from the dycore omega provider,
# which the runner enables automatically for this preset (see
# dycore.compute_omega; set it false to opt out and zero-fill them).
aerocom_groups: [cloud, column, plev, aerosol, nearsurface]
# Should match the radiation scheme's overlap assumption.
aerocom_overlap: maximum-random

# Per-species / per-mode / spectral aerosol optics (jax-gcm#584). Off here;
# see echam-jam-aerocom-optics.yaml.
aerocom_optics: false
# Aerosol-free (*noa) TOA fluxes for AeroCom ERFari (#583).
#
# TWO knobs, deliberately not one. ``aerosol_free_interval`` is the
# cost/fidelity dial; ``aerosol_free_alternate`` is a different scheme that
# happens to be cheap, and folding it into the dial would make the dial
# non-monotonic in cost AND silently change whether the physics is
# perturbed. Measured at T63L47:
#
#   interval=1   47.02 s/sim-day  +55 %   companion every radiation step
#   interval=4   32.47 s/sim-day  + 7 %
#   alternate    30.30 s/sim-day  + 0 %   <- but perturbs the model
#   (no *noa)    30.32 s/sim-day    —
#
# so "N=1, 2, 4" with N=2 meaning alternate would run 47 -> 30 -> 32: the
# dial gets cheaper then dearer, and only the middle setting changes the
# simulation. Keep them separate.
aerosol_free_radiation: true

# THE dial. N = radiation steps between aerosol-free samples, always PAIRED
# with the all-sky solve at that step:
#
#   N=1  companion every radiation step — the reference, exact ERFari
#   N=4  companion every 4th step       — measured +7 % instead of +55 %
#   N=8, 16, ...                        — cheaper still, ERFari refreshed
#                                         less often
#
# Physics is bit-identical at every N (the model always sees aerosol), so
# ERFari has a *predicted* value — it should match N=1 — and any deviation
# is a bug rather than something needing an ensemble to bound. Between
# companions the aerosol effect is held as a FRACTION of the all-sky flux;
# holding it as an absolute W/m2 breaks the SW at night (see #630).
aerosol_free_interval: 1

# NOT RECOMMENDED. Steals every other radiation call for the aerosol-free
# solve instead of adding one, so the *noa fluxes are free — but the model
# then feels aerosol-free heating half the time. That perturbs the
# simulation, so its ERFari cannot be compared against a reference without
# an ensemble: a full nudged year differed by 1.5 % while a zero-aerosol
# control put the scheme's intrinsic artefact at only ~0.001 W/m2, i.e.
# nearly all of the measured difference was chaotic divergence. Prefer a
# larger ``aerosol_free_interval``, which approaches the same cost without
# touching the physics (#630).
aerosol_free_alternate: false
