# ECHAM with RRTMGP radiation and the Lohmann 2-moment microphysics
# (Lohmann2MMicrophysics) in place of the 1-moment Echam1MMicrophysics.
#
# Same term list as ``physics=echam`` with one term swap. The 2M scheme
# carries qc / qi / qnc / qni as prognostic tracers (rain/snow live in
# the within-step fluxes, not tracers) and owns saturation adjustment
# internally (the ECHAM section-5 condensation closure + supersaturation
# corrections, #667), so it pairs with the pure-cf
# ``SundqvistCloudFraction`` upstream just like the merged 1M does.
#
# Use it as::
#
#     python -m jcm.main physics=echam-rrtmgp-2m

vectorize_columns: true
checkpoint_terms: true

# The land under the land tile. ``slim`` (default): SLIM (Lague, Bonan and
# Swann 2019), a water bucket, a snow bucket and a ten-layer soil temperature
# column with prescribed monthly surface properties from ``forcing.slim_file``
# (``auto``: the mirror's T63 bundle). ``prescribed``: the prescribed-moisture
# JSBACH tile with a prognostic skin (#979), which needs no SLIM dataset.
# ``slim_land`` overrides SLIM's constants (SlimParameters), e.g. the
# calibration levers
#     physics.slim_land.evap_res_scale=1.2 physics.slim_land.bucket_depth_scale=0.8
# See docs/source/science/surface.md ("The SLIM land").
land_model: slim
slim_land: {}

terms:
  moist_air_state:
    _target_: jcm.physics.diagnostics.moist_air_state.MoistAirColumnState
  echam_boundary_conditions:
    _target_: jcm.physics.forcing.echam_boundary_conditions.EchamBoundaryConditions
  macv2_sp_aerosol:
    _target_: jcm.physics.aerosol.Macv2SpAerosol
  simple_chemistry:
    _target_: jcm.physics.chemistry.SimpleChemistry
  sundqvist_cloud_fraction:
    _target_: jcm.physics.clouds.sundqvist.SundqvistCloudFraction
  rrtmgp_radiation:
    _target_: jcm.physics.radiation.rrtmgp.RRTMGPRadiation
    # Longwave transport of the library solve: ``two_stream`` (default) or
    # ``noscat`` (RTE's absorption-only solver, as ECHAM6's LW). Listed so
    # ``physics.terms.rrtmgp_radiation.lw_solver=noscat`` overrides it without
    # the Hydra ``+`` prefix.
    lw_solver: two_stream
    # jax-rrtmgp performance options, no effect on the physics (see
    # ``docs/source/design/rrtmgp_gpu_performance.md``): ``all_gpts`` computes
    # the gas optics of every g-point ahead of the spectral loop (``per_gpt``
    # computes it inside the loop), ``gpt_chunk`` g-points are solved per loop
    # iteration, and ``use_scan`` runs the vertical recurrences as a scan. These
    # values are the measured A100 optimum at T63L47 and T63L95.
    gas_optics_mode: all_gpts
    gpt_chunk: 64
    use_scan: true
    # Column loop: ``auto`` solves the columns in blocks of 8 per device,
    # strided across the mesh devices, on CPU (the solve is cache-bound there)
    # and as one vmap on a GPU (the A100-tuned program). An integer B sets the
    # block, ``null`` forces the single vmap. See
    # ``docs/source/design/rrtmgp_cpu_performance.md``.
    column_block: auto
  # ECHAM physc ordering: vdiff (with the surface exchange in its
  # implicit solve) runs BEFORE convection, so the Tiedtke zdqpbl
  # closure reads the SAME-STEP vdiff moisture tendency and delivered
  # evaporation. echam_surface only republishes the vdiff-delivered
  # fluxes, so it follows vdiff directly.
  tte_tke_vertical_diffusion:
    _target_: jcm.physics.vertical_diffusion.tte_tke.TteTkeVerticalDiffusion
  echam_surface:
    _target_: jcm.physics.surface.echam.surface_physics.EchamSurface
  tiedtke_convection:
    _target_: jcm.physics.convection.tiedtke_nordeng.TiedtkeConvection
  lohmann_2m_microphysics:
    _target_: jcm.physics.clouds.lohmann_2m.Lohmann2MMicrophysics
    params:
      # Droplets come from MACv2-SP simple plumes (SPA), not AR&G, so the
      # scheme defaults (calibrated on the JAM host) do not apply. ccraut is
      # calibrated on this host with its cover set; ECHAM's droplet floor of
      # 40 is kept because here it sets most of the droplet number
      # (docs/source/design/jam_aerosol_retune.md, "The v3.1 refit"). ccsaut
      # is ECHAM's generic 95.
      ccsaut: 95.0
      ccraut: 12.5
      cdnc_min_fixed: 40.0
  # Publishes the package-independent surface-exchange coupling struct
  # (jax-gcm#754; docs/source/design/surface_exchange.md). Placed after the
  # microphysics so the stratiform precipitation it reads is the same
  # step's.
  echam_surface_exchange:
    _target_: jcm.physics.surface.echam.surface_exchange_publisher.EchamSurfaceExchange
  hines_gwd:
    _target_: jcm.physics.gravity_waves.hines.HinesGwd
  lott_miller_sso:
    _target_: jcm.physics.gravity_waves.sso.LottMillerSso
