# ECHAM physics with the M7 (ECHAM-HAM) aerosol population on the JAM
# harness (jax-gcm#1017) -- a SKELETON preset, not yet a HAM-faithful run.
#
# This is factory-built exactly like echam-jam.yaml: `physics.builder` tells
# `runners.build_physics` to call `echam_physics(**these_kwargs)`. What each
# line below is for, and why it is NOT yet the full echam-ham-m7
# configuration the design note (docs/source/design/ham_m7_configuration.md)
# describes:
#
#   aerosol_module: jam        -- M7 is a SECOND population on the same JAM
#                                  harness MAM4 runs on (#461); nothing about
#                                  the harness itself is M7-specific.
#   cloud_scheme: 2m           -- JAM's activation/scavenging/ice-nucleation
#                                  terms need the 2-moment ledger (#708);
#                                  there is no 1M alternative.
#   radiation_scheme: rrtmgp   -- the reference configuration's radiation
#                                  (the design note's switch table); "grey"
#                                  is rejected by echam_physics for aerosol_module="jam".
#   jam_microphysics: m7_placeholder
#                              -- the kappa-Koehler zero-tendency core on the
#                                 M7 population (PlaceholderMicrophysics),
#                                 the chain-test vehicle until the real M7
#                                 core adapter (an m7-jax wrapper, the lead's
#                                 task) lands. No coagulation, condensation,
#                                 nucleation or ageing happens yet.
#   jam_cloud_borne: false     -- HAM has no explicit cloud-borne phase: it
#                                 scavenges interstitial aerosol by its
#                                 activated fraction (M7_SPEC.cloud_borne is
#                                 already False; this flag just keeps the
#                                 harness-level switch consistent with it).
#   jam_arg_variant: arg2000   -- the reference config's ncd_activ=2 (ARG);
#                                 HAM's own Koehler-A/B activation variant
#                                 (ham_arg) is not ported yet (owned by
#                                 another worker, #1017).
#   jam_anthropogenic: true   -- M7_SPEC.sector_emission now carries HAM's own
#                                 per-sector-class mode/size targets
#                                 (mo_ham_m7_emissions.f90, emissions/
#                                 ham_sectors.py), so AnthropogenicEmissions
#                                 sizes BC/OC/primary-SO4 the way HAM does
#                                 (fossil/energy_ships/biomass_like, with the
#                                 residential/energy subset channels) rather
#                                 than falling back to MAM4's primary_split
#                                 assumption. Still inert without a CEDS
#                                 forcing bundle (#498 Phases B-D).
#   jam_prescribed_speciated: false
#                              -- the already-speciated path is CAM6/MAM4-
#                                 faithful per-tracer injection, not yet
#                                 ported to M7's tracer names -- a later task.
#
# What IS already M7-faithful through this preset: the population itself
# (M7_SPEC -- modes, species, csr_conv, the HAM freezing-class mapping, the
# HAM aqueous-sulfate split, the M7 dust-emission policy, the per-sector
# primary-emission policy); every OTHER HAM-faithful variant in the design
# note's table (optics, wet deposition, sea salt, cirrus, and the real
# microphysics core) remains to be wired in by later #1017 tasks -- this
# preset composes correctly today but is not yet validated against ECHAM-HAM.
#
# Usage:
#
#     python -m jcm.main physics=echam-ham-m7 grid=echam_t63_l47_hybrid

builder: echam_physics

aerosol_module: jam
cloud_scheme: 2m
radiation_scheme: rrtmgp
jam_microphysics: m7_placeholder
jam_cloud_borne: false
jam_arg_variant: arg2000
jam_anthropogenic: true
jam_prescribed_speciated: false
