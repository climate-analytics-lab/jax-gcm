# ECHAM physics with the M7 aerosol population and core on the JAM harness
# (jax-gcm#1017). Named for what it is in jcm, not for its reference: HAM2.3
# is the baseline this configuration starts from, and it is expected to
# depart from HAM once that baseline works. Reference: ECHAM6.3-HAM2.3 r7492's
# run_transient_echam6-hamm7 with the namelist defaults it leaves unset,
# except where a line below says a maintainer decision differs. Design and
# provenance: docs/source/design/jam_m7_configuration.md.
#
# Factory-built like echam-jam.yaml: `physics.builder` tells
# `runners.build_physics` to call `echam_physics(**these_kwargs)`.
#
# Needs the m7-jax core: the jcm[m7] extra (m7-jax is not on PyPI yet; the
# user guide's "Running the ECHAM-JAM M7 aerosol preset" gives the install).
#
#     python -m jcm.main +configuration=t63-echam-jam

builder: echam_physics

# The land under the land tile. ``slim`` (default): SLIM (Lague, Bonan and
# Swann 2019), a water bucket, a snow bucket and a ten-layer soil temperature
# column with prescribed monthly surface properties from ``forcing.slim_file``
# (``auto``: the mirror's T63 bundle). ``prescribed``: the prescribed-moisture
# JSBACH tile with a prognostic skin (#979), which needs no SLIM dataset.
# ``slim_land`` overrides SLIM's constants (SlimParameters), e.g. the
# calibration levers
#     physics.slim_land.evap_res_scale=1.2 physics.slim_land.bucket_depth_scale=0.8
# See docs/source/science/surface.md ("The SLIM land").
land_model: slim
# SLIM's two calibration levers, fitted with the rest of this preset in the
# v3.1 structural refit (jam_aerosol_retune.md, "The structural refit"): the
# CLM5 evaporative-resistance map scaled by 1.01 and the bucket capacity by
# 1.18. Both are this host's values; the other ECHAM presets run SLIM at 1.0.
slim_land:
  evap_res_scale: 1.0129401
  bucket_depth_scale: 1.17501085

# M7 is a second population on the JAM harness (#461); the 2M scheme carries
# the scavenging ledger and consumes HAM's activation and freezing inputs, as
# ECHAM-HAM's lcdnc_progn=.true. 2M microphysics does.
aerosol_module: jam
cloud_scheme: 2m
radiation_scheme: rrtmgp
# jax-rrtmgp solver options: declared here (with the jcm defaults) so that
# ``physics.radiation_lw_solver=noscat`` and the two performance overrides work
# without the Hydra ``+`` prefix. ``all_gpts`` / 64 / ``use_scan`` are the
# measured A100 optimum, no effect on the physics (see
# docs/source/design/rrtmgp_gpu_performance.md); ``noscat`` is RTE's
# no-scattering LW solver (a selectable alternative, not the default).
radiation_lw_solver: two_stream
radiation_gas_optics_mode: all_gpts
radiation_gpt_chunk: 64
radiation_use_scan: true

# The microphysics core: m7-jax, the complete native m7 call on HAM's 18
# components (nwater=1, lscond, lscoag, ageing), with the reference
# H2SO4/H2O nucleation nsnucl=2 (Kazil and Lovejoy 2007, ion-mediated) driven
# by host-side GCR ionisation, and organic activation nucleation in the PBL
# (nonucl=1, HAM's default). nsnucl=2 reads HAM's PARNUC and GCR tables from
# the data mirror (products/ham_input/) or, when set, $HAM_INPUT_DIR; with
# neither, construction fails, naming both, rather than silently running
# other physics. To run without them, choose binary nucleation explicitly:
#     physics.jam_microphysics_options.nucleation_scheme=1
jam_microphysics: m7_jax
jam_microphysics_options:
  nucleation_scheme: 2

# HAM has no explicit cloud-borne phase: interstitial aerosol is scavenged by
# its activated fraction.
jam_cloud_borne: false

# Activation: HAM's Koehler A/B (electrolyte species) + ARG, ncd_activ=2.
# Updraft: the West et al. (2013) 20-bin PDF (nactivpdf=1). This DEVIATES from
# the reference-run template, which leaves nactivpdf at its code default 0
# (single updraft); the maintainer chose the PDF on 2026-10-05.
# jam_nactivpdf: 0 selects the template's single updraft; add
# ~physics.activation with it, since w_sigma_min below is the PDF's width floor
# and the single updraft does not read it.
jam_activation_scheme: ham_arg
jam_nactivpdf: 1

# Optics: HAM's four Mie tables (SW/LW x sigma 1.59/2.0) with ham_rad_fitplus
# nearest-neighbour lookup, built with jcm's Mie kernel on HAM's axes -- or
# HAM's own lut_optical_properties_M7*.nc when $HAM_INPUT_DIR holds them (as
# HAMMOZ's T63 input directory does). That is a different optics configuration
# from the one the dust and sea-salt scales below were fitted with, so set
# $HAM_INPUT_DIR for the nucleation tables to a directory holding only those.
jam_optics_backend: ham_lut

# Sea salt: the template's nseasalt=7, Long et al. (2011) with the Sofiev et
# al. (2011) SST correction.
jam_seasalt_scheme: long

# Primary emissions sized by HAM's per-sector rules (M7_SPEC.sector_emission);
# inert until an emissions bundle is supplied. The already-speciated path is
# MAM4's per-tracer injection and does not apply to M7's tracers.
jam_anthropogenic: true
jam_prescribed_speciated: false
# Volcanic SO2 (#1190), as echam-jam.yaml; its primary sulfate takes HAM's
# default sector sizes.
jam_volcanic: true

# Sea-salt scale on HAM's Long source. Unscaled, jcm's weak T63 L47 surface
# winds (#1058) leave too little sea salt; the scale calibrates the host's
# winds, not HAM's source function. 1.85 is the v3.1 structural refit's value,
# inside its 0.5-3 range (docs/source/design/jam_aerosol_retune.md, "The
# structural refit"; the release fit had it on the 2.0 lower bound, before
# SLIM's roughness raised the surface wind; the earlier burden sweep is in
# jam_m7_configuration.md).
seasalt:
  scale: 1.85040662

# Dust: HAM2's ndust=5 source, the reference run's own choice -- ndust=4's
# standard Zobler/East-Asia mixture, PLUS the MSG-SEVIRI Saharan
# dust-source-activation override (mo_ham_dust.f90:685-747) wherever
# forcing.dust_msg is positive. Needs forcing.dust_msg_file set (see
# jcm/config/configuration/t63-echam-jam.yaml, which sets it to "auto"; the
# four other dust companions stay "auto" by forcing/from_file.yaml's own
# default). HAM's regional threshold vector (nduscale_reg) is scaled to make
# up for jcm's weak Sahara wind (#1058): it calibrates the wind, not HAM's
# thresholds. 1.16 is the v3.1 structural refit's value (jam_aerosol_retune.md,
# "The structural refit"): above 1 because SLIM's roughness (a tenth of the
# CLM5 vegetation height) raised the Saharan 10 m wind by ~19 % and the
# bucket-based dust gates doubled the emission at the release value 0.983, so
# the threshold is scaled up rather than down. The MAM4 multiplier
# (NDUSCALE_JCM_T63_SCALE) belongs to that population's lifetimes and does not
# carry over.
jam_dust_preset: 5
jam_dust_nduscale_scale: 1.1574521
# HAM tunes the regional threshold vector differently for nudged runs (0.95/1.25
# at T63) than for free-running ones (1.05/1.45). ``null`` follows
# ``nudging.enabled``; set true/false to pin it. The 1.16 scale was fitted
# free-running, so a nudged run applies it to HAM's nudged vector.
jam_dust_nudged: null

# Wet deposition: the template's nwetdep=3, HAM's size-dependent in-cloud
# nucleation (ic_scav_nuc, ARG critical radius to match ncd_activ=2) and
# impaction (ic_scav_imp) scavenging plus the Croft below-cloud tables.
jam_wetdep_scheme: ham
jam_nucleation_activation: ham_arg
# The impaction and below-cloud lookups: "ham" corrects r7492's lookup
# defects (impaction: cdroprad(6) = 30 um by maintainer decision 2026-10-06,
# the swapped corners, the plate index above 50 um, the aerosol-radius
# bracket; below-cloud: the swapped corners, the zero rate below 0.0032 mm/h,
# the aerosol-radius bracket); "ham_r7492" reproduces r7492.
jam_incloud_impaction: ham
jam_below_cloud_lookup: ham

# Cirrus: nic_cirrus=2 (setphys.f90), Kaercher-Lohmann homogeneous
# nucleation limited by the M7 soluble aerosol number available for freezing.
# Warm autoconversion is M7's own: 19.8 is the v3.1 structural refit's value,
# fitted with net TOA as a target on four seasonal windows with the cover set
# below (jam_aerosol_retune.md, "The structural refit"; the release fit's 13
# was set by net TOA alone with the release cover). The droplet floor is the
# JAM hosts' 10 cm-3, HAM's lower one; HAM's reference run pairs 40 with
# ccraut 10.6 (mo_activ.f90), a maintainer decision to differ, fitted with
# ccraut.
microphysics_2m:
  nic_cirrus: 2
  ccraut: 19.8456116
  cdnc_min_fixed: 10.0

# Cloud cover: this host's own Sundqvist set, fitted in the v3.1 structural
# refit jointly with the levers above and below on the tree that carries SLIM,
# the surface-flux fixes (#1147) and HAM's convection pair. It overrides the
# JAM hosts' shared T63 set (JCM_CALIBRATED_COVER_T63_JAM, the release fit's
# 0.727 / 0.930 / 1.14 / 0.848 / 0.265), which echam-jam.yaml (MAM4) still
# reads: MAM4 was not refitted on the structural tree. The five fields are the
# ones ECHAM sets per truncation (mo_echam_cloud_params.f90::sucloud); the
# values are T63 L47's. A field set here is absolute: it replaces the
# truncation's default at every resolution, so a run of this preset off T63
# reads these T63 values unless it overrides them
# (docs/source/design/resolution_defaults.md).
clouds:
  crt: 0.780234995
  crs: 0.915316877
  nex: 1.02167105
  csatsc: 0.815789563
  cinv: 0.173069721

# The v3.1 structural refit of this host, fitted with the cover set and the
# aerosol scales above (jam_aerosol_retune.md, "The structural refit"): HAM's
# floor on the sub-grid updraft PDF width (mo_activ.f90; HAM uses 0.1 m/s),
# one wet-removal scale over the stratiform in-cloud scavenging, the Slinn
# impaction efficiency and the convective in-plume scavenging (Slinn carries
# only the convective below-cloud removal here: HAM's Croft tables carry the
# stratiform one and have no impaction term to scale), and the Nightingale
# DMS sea-air flux scale.
# Convection: HAM's own constants for this pairing. mo_echam_conv_constants.f90
# l.140-171 (r7492) re-sets the Tiedtke constants when lcdnc_progn is on, by
# truncation, level count and activation scheme; for T63 L47 with ARG
# activation (ncd_activ=2, this preset) they are cprcon 9e-4 and entrpen 2e-4
# (cmfctop 0.2 and entrscv 3e-3 are the ECHAM values jcm already carries). The
# ECHAM6.3 defaults the scheme carries otherwise (2.5e-4, 1e-4) are the
# non-HAM / L31-LL-activation values. At 2.5e-4 the updraft converts only
# 3-4 % of its condensate per layer, carries ~10 mg/kg of ice to 250 hPa and
# detrains it there; the 2M scheme sublimates most of it on arrival and the
# tropical 150-400 hPa layer ends 1.4x ERA5 in specific humidity and 1-1.5 K
# warm, which is a ~4 W/m2 clear-sky OLR deficit. With HAM's pair the layer
# is 0.8-1.1x ERA5 (docs/source/design/jam_aerosol_retune.md, "The
# structural refit", and docs/source/science/convection.md). The convective-snow
# autoconversion stays at jcm's 95 rather than HAM's paired 900 by maintainer
# decision 2026-11-07: with 9e-4 already thinning the anvil, 900 would leave
# too little ice.
convection:
  cprcon: 9.0e-4
  entrpen: 2.0e-4

activation:
  w_sigma_min: 0.049941278
wetdep:
  incloud_scale: 1.5868195
  impact_scale: 1.5868195
conv_transport:
  conv_scav_scale: 1.5868195
dms:
  flux_scale: 1.15399933
