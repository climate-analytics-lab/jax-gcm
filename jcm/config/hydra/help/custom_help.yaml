app_name: JCM


template: |

  ${hydra.help.app_name}: JAX General Circulation Model
  ----
  Runs atmospheric simulations using configurable parameters.

  Usage:
  ------
    python -m jcm.main [OVERRIDES...]

  Quick examples:
  ---------------
    Default 10-day SPEEDY aquaplanet run:
      python -m jcm.main

    ICON physics on T85x47 hybrid coords with grey radiation:
      python -m jcm.main physics=icon grid=icon_t85_l47_hybrid

    Held-Suarez 30-day integration:
      python -m jcm.main physics=held_suarez grid=held_suarez_t31_l8 \
          run.total_time=30 run.save_interval=1

    1-day smoke test (CI-friendly):
      python -m jcm.main run=smoke

    JW-style initial state with sponge enabled:
      python -m jcm.main physics=icon grid=icon_t85_l47_hybrid init=jw \
          run.sponge.levels=5

    Parameter sweep:
      python -m jcm.main -m run.time_step=10,20,30

  Top-level config groups:
  ------------------------
    physics:    speedy | icon | held_suarez
    grid:       speedy_t31_l8 | held_suarez_t31_l8 | icon_t85_l47_hybrid |
                icon_t42_l8_sigma
    run:        default | smoke | longrun        (time/save_interval/total_time)
    init:       isothermal | jw
    terrain:    aquaplanet | from_file
    diffusion:  default | strong

  Useful overrides:
  -----------------
    run.time_step:        Model timestep in minutes
    run.total_time:       Total simulation length in days
    run.save_interval:    Snapshot interval in days
    run.output:           Output netCDF filename (relative or absolute)
    run.output_averages:  Output time-averaged diagnostics (default: false)
    run.log_level:        DEBUG | INFO | WARNING | CRITICAL
    run.sponge.levels:    Top levels covered by Rayleigh sponge (0 = off)
    physics.radiation:    grey | rrtmgp | emulated  (icon only)
    physics.cloud_scheme: 1m | 2m                   (icon only)
    grid.layers:          Number of vertical levels
    grid.spectral_truncation: T-truncation (e.g. 31, 42, 85)

  Output:
  -------
  Creates in ./outputs/<date>/<time>:
    - <run.output>: Predictions as netCDF (default model_state.nc)
    - .hydra/:      Composed config + overrides
    - main.log:     Execution log
