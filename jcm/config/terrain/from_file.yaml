# Realistic orography + land-sea mask loaded from a netCDF boundary file.
kind: from_file
file: ???           # absolute path required at runtime
interpolate: true
# Fraction of a cell below which the smaller of land and sea is dropped: a land
# fraction at or below it becomes 0, one at or above 1 - fmask_threshold
# becomes 1 (jcm.terrain.get_terrain). 0 keeps every fraction, which is what a
# coupled ocean whose wet mask defines the coast needs -- the atmosphere's sea
# area is then exactly the ocean's, so a conservative flux map loses nothing
# to cells the atmosphere rounded to land. Range [0, 0.5]. For the file's mask
# to survive exactly, also set `interpolate: false` when the file is already
# on the model grid: resampling a mask onto its own grid changes it by up to
# about 1e-4 and leaves traces of land in open-ocean cells, which the default
# rounding hides and 0 does not.
fmask_threshold: 0.1
